<!doctype html>
<html lang="ar" dir="rtl" data-theme="%THEME%">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <!-- Every path goes through %BASE_URL%, which Vite fills in per build:
         the site lives under a project path on GitHub Pages, and a
         hand-written absolute path would look for its files at the domain
         root. The share card is the one absolute address, see vite.config.ts. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="مجلس نور" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://static.qurancdn.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600&display=swap"
    />
    <title>مجلس نور، حلقة قرآن أينما كنتم</title>
    <meta
      name="description"
      content="حلقة قرآن صغيرة يتناوب فيها القرّاء على مصحف المدينة صفحةً صفحة، كما يجلسون في حلقة المسجد، ومعهم إن شاؤوا شيخ تُسمَع تلاوته في دوره."
    />
    <meta property="og:title" content="مجلس نور" />
    <meta property="og:description" content="اقرؤوا القرآن معًا، دورًا بعد دور، في مصحف المدينة." />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%SHARE_CARD%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="شعار مجلس نور: مقاعد حول دائرة يتوسطها مصحف، على خلفية خضراء." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="مجلس نور" />
    <meta name="twitter:image" content="%SHARE_CARD%" />
    <style>
      /* Painted before the bundle loads, in the theme the reader chose, so a
         return visit never flashes the wrong colour. Each theme's ground and
         gold are written in at build time from src/styles/themes.ts. */
      %THEME_GROUNDS%
      body { margin: 0; }
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; color: var(--boot-gold); font: 600 28px/1.5 'Reem Kufi', system-ui, sans-serif; }
    </style>
    <script>
      try {
        // The key the app keeps its halaqa under, or the one it used as
        // مجلس آية, which src/halaqa/storage.ts adopts on first load.
        var saved = JSON.parse(
          localStorage.getItem('majlis-noor:v1') ||
            localStorage.getItem('majlis-ayah:v1') ||
            'null'
        );
        var theme = saved && saved.prefs && saved.prefs.theme;
        // Each theme's ground, written in from src/styles/themes.ts.
        var colors = %THEME_COLORS%;
        if (colors[theme]) {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[theme]);
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="boot" role="status">مجلس نور</div></div>
    <noscript>
      <p style="color:#f3ead8;text-align:center;font-family:system-ui;padding:24px">يحتاج مجلس نور إلى تفعيل جافاسكربت.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
