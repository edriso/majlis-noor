name: Check the audio host

# QuranicAudio replaces recordings in place, and a timing is only right for
# the file it was made from. Once a week, and whenever asked, this checks
# that every surah file of every reciter is still served, at the length and
# date the timings recorded, so a moved or replaced recording is found
# before a reader finds it. It never runs on a push: nothing in the
# repository changes what the host serves.
on:
  schedule:
    # Mondays at 04:23 UTC, off the hour when scheduled runs pile up.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check every surah file
        run: npm run check:audio
